<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SmileBot | A Beautiful Smile</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Space+Grotesk:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <div class="bg-shape bg-shape-a"></div>
    <div class="bg-shape bg-shape-b"></div>

    <main class="page-wrap">
      <section class="hero-card">
        <div class="brand-line">A BEAUTIFUL SMILE</div>
        <h1>SmileBot Reception Desk</h1>
        <p>
          Welcome to the office of Dr. Gina Mancini. Ask questions, request an
          appointment, or use voice mode for a hands-free experience.
        </p>
        <div class="hero-meta">
          <span>3685 Henderson Dr, Jacksonville, NC 28546</span>
          <span>Phone: 1-910-347-9100</span>
        </div>
      </section>

      <section class="chat-shell">
        <header class="chat-header">
          <div>
            <h2>Live Assistant</h2>
            <p id="statusText">Ready</p>
          </div>
          <div class="header-actions">
            <label class="voice-toggle">
              <input type="checkbox" id="autoSpeak" checked />
              <span>Voice Replies</span>
            </label>
            <button id="newChatBtn" class="ghost-btn" type="button">New Chat</button>
          </div>
        </header>

        <div id="chatMessages" class="chat-messages" aria-live="polite"></div>

        <footer class="chat-input-bar">
          <textarea
            id="messageInput"
            rows="1"
            placeholder="Type your message..."
          ></textarea>
          <div class="input-actions">
            <button id="micBtn" class="voice-btn" type="button" title="Voice input">
              Speak
            </button>
            <button id="stopVoiceBtn" class="ghost-btn" type="button" title="Stop speaking">
              Stop Voice
            </button>
            <button id="sendBtn" class="send-btn" type="button">Send</button>
          </div>
        </footer>
      </section>
    </main>

    <script src="/static/app.js"></script>
  </body>
</html>
